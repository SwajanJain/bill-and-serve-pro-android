version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: bill-and-serve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bill_and_serve_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
